stages:
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

unit-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  coverage: '/Line coverage:\s*([\d.]+)%/'
  script:
    - dotnet restore Apha.Sdo.Persistence.Functions.Tests/Apha.Sdo.Persistence.Functions.Tests.csproj
    - dotnet test Apha.Sdo.Persistence.Functions.Tests/Apha.Sdo.Persistence.Functions.Tests.csproj
        --configuration Release
        --logger "junit;LogFilePath=../artifacts/test-results/{assembly}.xml"
        --collect:"XPlat Code Coverage"
        --results-directory artifacts/coverage
    - dotnet tool install --global dotnet-reportgenerator-globaltool
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - reportgenerator
        "-reports:artifacts/coverage/**/coverage.cobertura.xml"
        "-targetdir:artifacts/coverage/report"
        "-reporttypes:Cobertura;TextSummary"
    - cat artifacts/coverage/report/Summary.txt
  artifacts:
    when: always
    paths:
      - artifacts/test-results/
      - artifacts/coverage/report/
    reports:
      junit: artifacts/test-results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/coverage/report/Cobertura.xml
